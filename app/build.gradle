plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.adblocker'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.adblocker"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.3.0"
    }

    // Only sign release builds when all 4 credentials are provided via environment.
    def releaseKeystore = System.getenv('ADBLOCKER_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('ADBLOCKER_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('ADBLOCKER_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('ADBLOCKER_KEY_PASSWORD')
    def canSignRelease = [releaseKeystore, releaseStorePassword,
                          releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }
    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Kotlin 1.8 merged kotlin-stdlib-jdk7 and -jdk8 INTO kotlin-stdlib. Our
// AndroidX deps still drag in an old kotlin-stdlib-jdk8 (1.6.21) that carries
// those same classes, so Gradle sees duplicates and fails. Forcing every
// stdlib artifact to 1.8.10 turns jdk7/jdk8 into empty shims -> no duplicates.
configurations.all {
    resolutionStrategy.force(
        'org.jetbrains.kotlin:kotlin-stdlib:1.8.10',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    )
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.7.2'
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
