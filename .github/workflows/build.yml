name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adblocker-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          # PRs read main's cached dependencies; only main updates the cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Check bounded Gradle retry policy (offline self-test)
        run: bash scripts/test-ci-gradle.sh
      - name: Lint, unit tests and debug APK
        run: bash scripts/ci-gradle.sh lintDebug testDebugUnitTest assembleDebug
      - name: Verify APK metadata and checksum
        run: bash scripts/verify-debug-apk.sh
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-ci-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
