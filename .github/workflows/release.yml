name: Signed Release APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adblocker-signed-release
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # Keep Gradle User Home out of shared caches for signing-secret jobs.
          cache-disabled: true
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build and verify signed release
        env:
          ADBLOCKER_KEYSTORE_BASE64: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 }}
          ADBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCKER_KEYSTORE_PASSWORD }}
          ADBLOCKER_KEY_ALIAS: ${{ secrets.ADBLOCKER_KEY_ALIAS }}
          ADBLOCKER_KEY_PASSWORD: ${{ secrets.ADBLOCKER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ADBLOCKER_KEYSTORE_BASE64 ADBLOCKER_KEYSTORE_PASSWORD ADBLOCKER_KEY_ALIAS ADBLOCKER_KEY_PASSWORD; do
            if [ -z "$(printenv "$secret")" ]; then
              echo "::error::Missing signing secret: $secret"
              exit 1
            fi
          done
          export ADBLOCKER_KEYSTORE_PATH="$RUNNER_TEMP/adblocker-release.jks"
          umask 077
          trap 'rm -f "$ADBLOCKER_KEYSTORE_PATH"' EXIT
          printf '%s' "$ADBLOCKER_KEYSTORE_BASE64" | base64 --decode > "$ADBLOCKER_KEYSTORE_PATH"
          unset ADBLOCKER_KEYSTORE_BASE64
          bash scripts/ci-gradle.sh lintRelease testDebugUnitTest assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"

          expected_id="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | sed -n '1p')"
          expected_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | sed -n '1p')"
          expected_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | sed -n '1p')"
          package_line="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package: ')"
          if [[ "$package_line" != *"name='$expected_id'"* || "$package_line" != *"versionCode='$expected_code'"* || "$package_line" != *"versionName='$expected_name'"* ]]; then
            echo "::error::Signed APK identity/version does not match app/build.gradle"
            exit 1
          fi
          (cd app/build/outputs/apk/release && sha256sum app-release.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Create draft prerelease and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | sed -n '1p')"
          tag="v$version_name"
          apk="app/build/outputs/apk/release/app-release.apk"
          checksum="app/build/outputs/apk/release/SHA256SUMS"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for $tag already exists. Review it before attempting another publication."
            exit 1
          fi
          gh release create "$tag" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "AdBlocker $version_name" \
            --notes-file "docs/releases/$version_name.md" \
            "$apk" "$checksum"
      - name: Upload signed APK and checksum as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
