name: Signed Release APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adblocker-signed-release
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build and verify signed release
        env:
          ADBLOCKER_KEYSTORE_BASE64: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 }}
          ADBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCKER_KEYSTORE_PASSWORD }}
          ADBLOCKER_KEY_ALIAS: ${{ secrets.ADBLOCKER_KEY_ALIAS }}
          ADBLOCKER_KEY_PASSWORD: ${{ secrets.ADBLOCKER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ADBLOCKER_KEYSTORE_BASE64 ADBLOCKER_KEYSTORE_PASSWORD ADBLOCKER_KEY_ALIAS ADBLOCKER_KEY_PASSWORD; do
            if [ -z "$(printenv "$secret")" ]; then
              echo "::error::Missing signing secret: $secret"
              exit 1
            fi
          done
          export ADBLOCKER_KEYSTORE_PATH="$RUNNER_TEMP/adblocker-release.jks"
          umask 077
          trap 'rm -f "$ADBLOCKER_KEYSTORE_PATH"' EXIT
          printf '%s' "$ADBLOCKER_KEYSTORE_BASE64" | base64 --decode > "$ADBLOCKER_KEYSTORE_PATH"
          unset ADBLOCKER_KEYSTORE_BASE64
          gradle --no-daemon --stacktrace lintRelease testDebugUnitTest assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          (cd app/build/outputs/apk/release && sha256sum app-release.apk > SHA256SUMS)
          unzip -t "$apk" >/dev/null
      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
